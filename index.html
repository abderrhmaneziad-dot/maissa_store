<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجري الإلكتروني</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background: #218838;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 26px; }
    header p { margin: 8px 0 0; opacity: 0.9; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* تصميم عرض المنتجات */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .product-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 4px; background: #eee; }
    .product-card h3 { margin: 10px 0 5px; font-size: 18px; }
    .product-card p { color: #28a745; font-weight: bold; font-size: 16px; margin: 5px 0 15px; }
    .buy-btn { background-color: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
    .buy-btn:hover { background-color: #218838; }
    .empty-msg { text-align: center; color: #777; grid-column: 1 / -1; padding: 30px; font-size: 16px; }

    footer {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 13px;
    }
    footer a { color: #28a745; text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <h1>🛍️ متجري الإلكتروني</h1>
    <p>أفضل المنتجات بأفضل الأسعار</p>
  </header>

  <main>
    <!-- هنا تظهر المنتجات تلقائياً من data/products.json -->
    <div class="products-grid">
      <p class="empty-msg">جاري تحميل المنتجات...</p>
    </div>
  </main>

  <footer>
    <a href="/admin">لوحة إدارة المتجر (خاصة بالمالك)</a>
  </footer>

  <script>
    async function loadProducts() {
      const grid = document.querySelector('.products-grid');
      try {
        const response = await fetch('/data/products.json');
        const data = await response.json();
        const products = data.items || [];

        if (products.length === 0) {
          grid.innerHTML = '<p class="empty-msg">لا توجد منتجات حالياً، تابعونا قريباً</p>';
          return;
        }

        grid.innerHTML = products.map(function (product) {
          return `
            <div class="product-card">
              <img src="${product.image || ''}" alt="${product.name}">
              <h3>${product.name}</h3>
              <p>${product.price} دج</p>
              <button class="buy-btn">اطلب الآن</button>
            </div>
          `;
        }).join('');

      } catch (error) {
        grid.innerHTML = '<p class="empty-msg">تعذر تحميل المنتجات حالياً</p>';
      }
    }

    loadProducts();
  </script>

</body>
</html>
